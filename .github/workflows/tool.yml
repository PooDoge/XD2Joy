name: desktop tool

on:
  push:
    paths: ["tool/**", ".github/workflows/tool.yml"]
  pull_request:
    paths: ["tool/**", ".github/workflows/tool.yml"]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tool
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
